name: Execute scheduled GBP posts

# 予約投稿の定期実行トリガー（15分おき）。
# 実際の投稿処理は本番の /api/cron/execute-scheduled が行う。
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call execution endpoint
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://gbp-optimizer-phi.vercel.app/api/cron/execute-scheduled"
